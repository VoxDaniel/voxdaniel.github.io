<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
            line-height: 1.6;
            background-color: #fafafa;
        }
        .container {
            background: #555;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        .bio {
            color: #666;
            margin-bottom: 30px;
        }
        .section {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .section h2 {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            margin-bottom: 10px;
        }
        .weekly-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Picture -->
        <img src="profile.jpg" alt="Profile Picture" class="profile-img">
        
        <!-- Name & Bio -->
        <h1>Daniel Vox</h1>
        <p class="bio">Musician, songwriter, and creator. Crafting sound and words.</p>

        <!-- Weekly Status -->
        <div class="section">
            <h2>This Week's Status</h2>
            <p>Working on new vocal arrangements and refining the mix for an upcoming project.</p>
        </div>

        <!-- Weekly Picture -->
        <div class="section">
            <h2>This Week's Snapshot</h2>
            <img src="weekly.jpg" alt="This week's capture" class="weekly-img">
        </div>
    </div>

</body>
</html>
